<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — отчёты отдела</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="container" style="max-width:420px; margin-top:8vh;">
    <div class="card">
        <h1>Вход для сотрудников</h1>
        <p class="muted small">Просмотр и скачивание отчётов открыты всем без входа.</p>

        <div class="alert error" th:if="${param.error}">Неверный логин или пароль.</div>
        <div class="alert info" th:if="${param.logout}">Вы вышли из системы.</div>

        <form method="post" th:action="@{/login}">
            <label class="field">Логин
                <input type="text" name="username" required autofocus autocomplete="username">
            </label>
            <label class="field">Пароль
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button class="btn" type="submit" style="width:100%">Войти</button>
        </form>
    </div>
    <p style="text-align:center"><a href="/">← к публичным отчётам</a></p>
</div>
</body>
</html>
